<!DOCTYPE html>
<!-- @language HTML (Jinja2 email template) -->
<!-- @updated 2026-09-07 -->
<!-- @changed Restyled to match reset_password.html's on-brand structure (orange #FA6C43 accent,
     rounded card, logo_url/illustration_url passed from auth.py) instead of the old generic
     indigo template. Illustration is the survey-clipboard-research brand icon. Added
     color-scheme/supported-color-schemes meta tags so email clients don't auto-dark-mode it. -->
<html>
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title>Verify your ACTR Lab email</title>
    <style>
        body { margin: 0; padding: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #ffffff; color: #222222; -webkit-font-smoothing: antialiased; }
        .container { max-width: 560px; margin: 0 auto; padding: 48px 24px; }
        .card { background-color: #ffffff; padding: 32px 40px 40px; border-radius: 20px; border: 1px solid #eaeaea; }
        .header { text-align: left; margin-bottom: 24px; }
        .logo { display: inline-block; height: 36px; width: auto; vertical-align: middle; }
        .hero { text-align: center; margin: 8px 0 24px; padding-right: 30px; }
        .hero img { display: block; margin: 0 auto; max-width: 100px; height: auto; }
        .hook { color: #222222; font-size: 26px; line-height: 32px; font-weight: 800; letter-spacing: -0.01em; margin: 8px 0 16px; text-align: center; }
        .hook .accent { color: #FA6C43; }
        .body-text { color: #555555; font-size: 15px; line-height: 22px; margin: 0 0 28px; text-align: center; }
        .cta-row { text-align: center; }
        .btn { display: inline-block; background-color: #FA6C43; color: #ffffff !important; padding: 14px 36px; text-decoration: none; border-radius: 12px; font-weight: 700; font-size: 15px; letter-spacing: 0.01em; }
        .btn:hover { background-color: #E55B34; }
        .ignore { color: #999999; font-size: 12px; line-height: 18px; margin: 36px 0 0; padding-top: 24px; border-top: 1px solid #f0f0f0; text-align: center; }
        .footer { margin-top: 20px; font-size: 11px; color: #b8b8b8; text-align: center; letter-spacing: 0.04em; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <img src="{{ logo_url }}" alt="ACTR Lab" class="logo" />
            </div>
            <div class="hero">
                <img src="{{ illustration_url }}" alt="" width="88" />
            </div>
            <p class="hook">Welcome to <span class="accent">ACTR Lab</span> &mdash;<br/>let&rsquo;s verify your email</p>
            <p class="body-text">Thanks for joining! One click and you&rsquo;re in &mdash; this link expires in 1 hour.</p>

            <div class="cta-row">
                <a href="{{ verify_url }}" class="btn">Verify My Account</a>
            </div>

            <p class="ignore">If you didn&rsquo;t create an account, you can safely ignore this email.</p>
        </div>
        <div class="footer">
            <p>&copy; 2026 ACTR Lab</p>
        </div>
    </div>
</body>
</html>
