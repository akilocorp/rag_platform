# @language  Nginx
# @updated   2026-09-30
# @changed   index.html is served no-cache (browsers always pick up the latest deploy); hashed /assets/
#            are cached for a year.
#            Prior: /hume/ relay (Hume EVI WebSocket → api.hume.ai) is now what every voice call uses.
#
# This is the Nginx configuration for INSIDE the frontend Docker container.

server {
    # Both stacks, on purpose. nginx's 10-listen-on-ipv6-by-default.sh adds the
    # IPv6 line for you, but ONLY to an unmodified default.conf -- against this
    # file it logs "differs from the packaged version" and adds nothing. That is
    # how a container serving fine over IPv4 failed a `wget http://localhost/`
    # healthcheck, which in Alpine may resolve to ::1 and find nothing bound.
    listen 80;
    listen [::]:80;

    server_name _;

    # Serve React App
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri /index.html;
    }

    # index.html names the current JS/CSS bundles, so browsers must re-check it on
    # every load or they keep running the previous deploy (seen twice: a phone on an
    # old debug build, a professor on an old scoring page). The bundles themselves
    # have content-hashed names, so they can be cached forever.
    location = /index.html {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
    }
    location /assets/ {
        root   /usr/share/nginx/html;
        # No `always`: only successful responses are cacheable, so a 404 during a
        # deploy is never remembered for a year.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Proxy API requests to the backend service
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Set timeouts and max body size for large file uploads
        proxy_connect_timeout 900s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        client_max_body_size 500M;
        
        # Handle WebSocket connections
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # CORS configuration
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range';
        
        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # Hume EVI relay — every voice call uses it (EVIAudioControls' humeHostname).
    # The browser opens its WebSocket to <this site>/hume/... and we forward it to
    # api.hume.ai, so Hume only ever sees this server.
    # Devices that cannot open a socket to api.hume.ai directly (seen from Hong
    # Kong on every phone and iPad) can still reach our own domain. The access
    # token rides in the query string, so this location keeps no access log.
    location /hume/ {
        proxy_pass https://api.hume.ai/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host api.hume.ai;
        proxy_ssl_server_name on;
        proxy_ssl_name api.hume.ai;
        # A call can run for its whole length without a frame in one direction.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        access_log off;
    }

    # Proxy calibration tool (Flask-rendered page, not React)
    location /calibrate {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Socket.IO connections to the backend service
    location /socket.io/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Handle server errors
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
